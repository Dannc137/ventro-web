<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ventro — Plan events together</title>
    <meta name="description" content="Tasks, budgets and contributions in one place, so your team stops chasing each other in group chats." />
    <meta name="theme-color" content="#4F46E5" />
  </head>
    <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ventro-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
